<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scripl AI | Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div id="auth-wrapper">
        <div id="start" class="auth-card">
            <h1 style="margin-top: 50px;">Scripl AI</h1>
            <button type="button" onclick="showAuth('login')">Login</button>
            <button type="button" onclick="showAuth('signup')">Sign-up</button>
            <button type="button" onclick="home('Guest')">Skip</button>
        </div>

        <div id="login" class="auth-card" hidden>
            <h2>Login</h2>
            <input id="le" placeholder="Email">
            <input id="lp" type="password" placeholder="Password">
            <button type="button" onclick="login()">Login</button>
        </div>

        <div id="signup" class="auth-card" hidden>
            <h2>Signup</h2>
            <input id="n" placeholder="Name">
            <input id="e" placeholder="Email">
            <input id="p" type="password" placeholder="Password">
            <button type="button" onclick="signup()">Signup</button>
        </div>
        
        <footer class="bottom-bar">
            <p>Scripl® AI  v1.0</p> 
            <a href="https://satyakam.pro"> Contact us</a>
        </footer>
    </div>

    <div class="app-container" id="chat-wrapper" hidden>
        <aside class="sidebar collapsed" id="sidebar">
            <div class="sidebar-logo-container" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="logo">SCRIPL<span>AI</span></div>
                <button type="button" class="sidebar-close-btn" onclick="toggleSidebar()" style="display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            
            <nav class="nav-links">
                <div class="nav-item active" onclick="newSession()" id="new-sess-btn">New Session</div>
                <div class="nav-item" onclick="clearMemory()">Clear Memory</div>
                <div id="history-list" style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;"></div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="avatar" id="sidebar-avatar">SS</div>
                    <div class="user-details">
                        <div class="user-info-text">
                            <div class="username" id="sidebar-username">Satyakam Swami</div>
                            <div class="status" id="sidebar-status">Premium Access</div>
                        </div>
                        <button type="button" class="logout-btn" onclick="logout()" title="Logout">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-nav">
                <div class="nav-left">
                    <button type="button" class="menu-toggle-btn" onclick="toggleSidebar()">=</button>
                    <div class="logo nav-logo">SCRIPL<span>AI</span></div>
                </div>
                <div class="nav-right">
                    <div class="theme-switch-wrapper">
                        <span id="theme-label">Light</span>
                        <label class="switch">
                            <input type="checkbox" id="themeCheckbox" onclick="toggleTheme()">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </header>

            <div id="chat" class="conversation-zone"></div>

            <div class="input-section">
                <div class="input-container">
                    <input id="msg" type="text" placeholder="Message Scripl..." autocomplete="off">
                    <button type="button" class="send-trigger" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10 15 12 2 14z"></path></svg>
                    </button>
                </div>
                <p class="brand-footer" style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 10px; text-align: center;">Scripl AI can make mistakes.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
